name: 🍎 Build Apple Watch App

on:
  push:
    branches: [ main ]
    paths:
      - 'watchos-companion/**'
      - 'IronFlowWatch/**'
      - '.github/workflows/watchos.yml'
  workflow_dispatch:   # permite rodar manualmente

jobs:
  build-watch:
    name: Build & Archive WatchOS App
    runs-on: macos-15

    steps:
      # 1. Checkout do repositório
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Seleciona Xcode mais recente
      - name: 🛠 Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 3. Mostra versão do Xcode (debug)
      - name: ℹ️ Xcode version
        run: xcodebuild -version

      # 4. Compila o app para simulador (valida o código sem precisar de assinatura)
      - name: 🔨 Build for Simulator (validation)
        run: |
          xcodebuild \
            -project IronFlowWatch/IronFlowWatch.xcodeproj \
            -scheme IronFlowWatch \
            -sdk watchsimulator \
            -configuration Debug \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm)' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      # 5. (Opcional) Archive para dispositivo real — requer certificado
      # Descomente este passo quando tiver Apple Developer Account e secrets configurados
      # - name: 📦 Archive for Device
      #   run: |
      #     xcodebuild \
      #       -project IronFlowWatch/IronFlowWatch.xcodeproj \
      #       -scheme IronFlowWatch \
      #       -sdk watchos \
      #       -configuration Release \
      #       -archivePath build/IronFlowWatch.xcarchive \
      #       CODE_SIGN_IDENTITY="Apple Distribution" \
      #       archive
      
      # 6. Upload do build log como artifact
      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          retention-days: 7
